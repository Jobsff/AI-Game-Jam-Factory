name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests
        shell: bash
        run: npm test 2>&1 | tee test-output.log
      - name: Expose unit test failure tail via annotations
        if: failure()
        shell: bash
        run: |
          tail -n 80 test-output.log | grep -v '^[[:space:]]*$' | head -c 6000 | fold -s -w 480 | while IFS= read -r line; do
            echo "::error::${line}"
          done
      - name: Repository validation
        run: npm run validate
      - name: Offline smoke
        run: npm run smoke
